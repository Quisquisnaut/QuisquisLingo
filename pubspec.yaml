name: quisquislingo_app
description: Offline-first language learning prototype with topics, rounds, exercises, streaks, duels, profiles, and optional cross-platform TTS.
publish_to: "none"
version: 2.0.20+220
environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  quisquislingo_flutter_tts_windows:
    path: packages/quisquislingo_flutter_tts_windows
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.5
  window_manager: ^0.5.2
  path_provider: ^2.1.5
  package_info_plus: ^8.3.0
  archive: ^4.0.9
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/courses/
    - assets/branding/
    - assets/olive_tree.png
    - assets/topic_plants/
    - assets/audio/
    - assets/exercise_images/
    - assets/mascots/
